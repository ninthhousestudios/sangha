[package]
name = "sangha"
version = "0.1.0"
edition = "2024"
publish = false
license = "MPL-2.0"
description = "Session coordination daemon for manas — registry, advisory locks, broadcast inbox"

[[bin]]
name = "sangha"
path = "src/main.rs"

[lib]
name = "sangha"
path = "src/lib.rs"

[dependencies]
rmcp = { version = "1", features = ["server", "transport-io", "transport-streamable-http-server", "macros", "schemars"] }
schemars = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
parking_lot = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "net"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
reqwest = { version = "0.12", features = ["json"] }
